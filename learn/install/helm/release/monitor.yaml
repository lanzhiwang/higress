---
# Source: monitor-stack-v2/charts/grafana/templates/tests/test.yaml
apiVersion: v1
kind: Pod
metadata:
  name: monitor-grafana-test
  labels:
    helm.sh/chart: grafana-5.0.13
    app.kubernetes.io/name: grafana
